name: build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
      - run: |
           docker build -f docker/Dockerfile \
             --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
             --tag metaworld-docker .
      - name: Run tests
        # Python 3.14+ defaults to forkserver; MT50 starts 50 MuJoCo workers,
        # whose separate imports exceed small runners' memory. Keep the Linux
        # process context used by the existing Python 3.11-3.13 jobs.
        run: docker run -e METAWORLD_TEST_START_METHOD=fork metaworld-docker pytest tests/*
#      - name: Run doctests
#        run: docker run metaworld-docker pytest --doctest-modules metaworld/
